name: Sync Upstream

on:
  schedule:
    # 每天 UTC 时间 0:00 (北京时间 8:00) 自动运行
    - cron: '0 0 * * *'
  # 支持在 GitHub Actions 页面手动触发
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0 # 完整拉取历史记录，确保能够平滑合并

      - name: Sync upstream changes via Git
        run: |
          # 配置 Git 提交身份
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 添加上游仓库地址并拉取 master 分支
          git remote add upstream https://github.com/CYQawa/YunX.git
          git fetch upstream master

          # 切换到 master 并合并上游分支
          git checkout master
          git merge upstream/master --no-edit

          # 推送最新代码到你自己的仓库
          git push origin master
